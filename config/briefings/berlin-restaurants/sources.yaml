# New-opening radar — RSS from food press, fetched by scripts/fetch_rss.py (item format "restaurant").
# Articles are reported in the briefing as "New openings to watch" (headline + link, no review, no Maps
# check), so thin coverage is fine: the value is knowing a place exists and who wrote about it.
rss_max_age_hours: 216  # 9 days — weekly Thursday run plus slack for late feeds

# A post is kept when its title/summary contains an opening term. Feeds marked general: true also
# need a food term, so culture/news posts that say "opens" are dropped.
opening_terms:
  - eröffnet
  - eröffnung
  - neueröffnung
  - neu eröffnet
  - neuer laden
  - macht auf
  - öffnet
  - new restaurant
  - new opening
  - new openings
  - opening
  - opens
  - opened
  - now open
  - just opened
  - debut
  - first look
  - pop-up
  - neu in berlin
food_terms:
  - restaurant
  - café
  - cafe
  - bar
  - bistro
  - bakery
  - bäckerei
  - food
  - essen
  - küche
  - kitchen
  - imbiss
  - ramen
  - noodle
  - dining
  - wine
  - brunch
  - pizza
  - eatery

# RSS feeds (fetch_rss.py). Untested ones are skipped and logged under "errors" in
# inbox/berlin-restaurants/*-rss.json; first live run (2026-10-22) showed Cee Cee works and the
# others returned HTML instead of XML.
rss_feeds:
  - publisher: Cee Cee Berlin
    url: https://ceecee.cc/feed/
    general: true
    max_items: 10
  # Berlin Food Stories feed link supplied by the owner (2026-10-28).
  - publisher: Berlin Food Stories
    url: https://www.berlinfoodstories.com/feed
    max_items: 10
  # Untested guess — replace with the publisher's real feed link if it keeps failing.
  - publisher: tip Berlin
    url: https://www.tip-berlin.de/feed/
    general: true
    max_items: 10

# WordPress REST API (fetch_wordpress.py). The Berliner and Exberliner RSS feeds do not parse in
# CI, but their wp-json endpoints work (proven by the berlin-culture briefing).
wordpress_feeds:
  - publisher: The Berliner
    url: https://www.the-berliner.com/wp-json/wp/v2/posts
    general: true
    max_items: 40
  - publisher: Exberliner
    url: https://www.exberliner.com/wp-json/wp/v2/posts
    general: true
    max_items: 40

