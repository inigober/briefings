# General editorial preference
editorial_note: >
  Favour critical, left-leaning outlets where quality reporting aligns with reader preferences.

# RSS: headline ingestion (scripts/fetch_rss.py → inbox/YYYY-MM-DD-rss.json).
# WordPress: REST API posts (scripts/fetch_wordpress.py → inbox/YYYY-MM-DD-wordpress.json).
# merge_news_inbox.py combines both into inbox/YYYY-MM-DD-raw.json.
# Fields: url (required), publisher, section_ids ([spain|germany|berlin|world]),
#         max_items (per feed, default 12), max_age_hours (default 72 for news).
rss_feeds:
  # Spain
  - url: https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/portada
    publisher: EL PAÍS
    section_ids: [spain]
    max_items: 10
  - url: https://www.eldiario.es/rss/
    publisher: eldiario.es
    section_ids: [spain]
    max_items: 10
  - url: https://www.lavanguardia.com/rss/home.xml
    publisher: La Vanguardia
    section_ids: [spain]
    max_items: 8
