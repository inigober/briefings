    - venue: Floating University
      url: https://floating-berlin.org/calendar-2026/
      note: use /calendar-YYYY/ for current season (May–October)
    - venue: Ballhaus Naunynstraße
      url: https://ballhausnaunynstrasse.de/en/programm
    - venue: Dock 11
      url: https://www.dock11-berlin.de/en/program
    - venue: Tanzfabrik
      url: https://www.tanzfabrik-berlin.de/en/programme
    - venue: Volksbühne
      url: https://www.volksbuehne.berlin/en/program
  wildcards:
    - venue: Floating University
      url: https://floating-berlin.org/calendar-2026/
      note: talks, symposia, workshops, Open Thursdays — use /calendar-YYYY/
  music:
    - venue: Silent Green
      url: https://www.silent-green.net/en/program
    - venue: KM28
      url: https://www.km28.de/en/program
    - venue: MONOM
      url: https://monom.berlin/en/events
    - venue: Morphine Raum
