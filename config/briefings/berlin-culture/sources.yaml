primary_calendars:
  - name: Cee Cee Berlin
    url: https://ceecee.cc
    use_for: [new openings, pop-ups, small exhibitions, one-offs]
  - name: 20% Berlin
    url: https://20percent.berlin
    use_for: [alternative programming, artist-led events]
  - name: The Berliner
    url: https://www.the-berliner.com
    use_for: [exhibition roundups, reviews, festival coverage]
