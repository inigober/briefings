# Berlin culture — domains, calendars, and RSS feeds for pre-fetch.

rss_max_age_hours: 336  # 14 days — weekly briefing window
advance_horizon_days: 14  # post-week programme items kept for Advance Radar

rss_feeds:
  - publisher: Cee Cee Berlin
    url: https://ceecee.cc/feed/
    section_ids: [wildcards]
    max_items: 10
  - publisher: Berlin Art Link
    url: https://www.berlinartlink.com/feed/
    section_ids: [exhibitions]
    max_items: 12
  - publisher: 20% Berlin
    url: https://20percent.berlin/feed/
    section_ids: [wildcards]
    max_items: 10
  - publisher: Ballhaus Naunynstraße
    url: https://ballhausnaunynstrasse.de/feed/
    venue: Ballhaus Naunynstraße
    section_ids: [performing_arts]
    max_items: 10
    programme: true
  - publisher: A-Trane
    url: https://a-trane.de/events/feed/
    venue: A-Trane
    section_ids: [music]
    max_items: 12
    programme: true
  - publisher: Exberliner
    url: https://www.exberliner.com/feed/
    section_ids: [wildcards, film, exhibitions]
    max_items: 10
  - publisher: Silent Green
    url: https://www.silent-green.net/feed/
    venue: Silent Green
    section_ids: [music]
    max_items: 10
    programme: true
    note: RSS XML often malformed — html_calendar_feeds is primary

wordpress_feeds:
  - publisher: The Berliner
    url: https://www.the-berliner.com/wp-json/wp/v2/posts
    venue: The Berliner
    section_ids: [wildcards]
    max_items: 12
  - publisher: Exberliner
    url: https://www.exberliner.com/wp-json/wp/v2/posts
    venue: Exberliner
    section_ids: [wildcards, film, exhibitions]
    max_items: 12

# WordPress event APIs — dated programme items (not editorial posts).
wordpress_event_feeds:
  - publisher: Exberliner
    url: https://www.exberliner.com/wp-json/wp/v2/posts
    api_kind: wp_rest
    section_ids: [wildcards, film]
    max_items: 12

# ICS venue calendars — skipped gracefully when URL is not a real VCALENDAR export.
ics_feeds: []

# HTML / per-event ICS scrapers for venues without reliable RSS.
html_calendar_feeds:
  - publisher: Index Berlin
    fetcher: index_berlin
    section_ids: [exhibitions, wildcards]
    max_items: 40
    max_advance_items: 8
  - publisher: Silent Green
    fetcher: silent_green_programme
    venue: Silent Green
    section_ids: [music]
    max_items: 30
    max_advance_items: 8

# Editorial feeds — context only; do not count as venue programme coverage.
press_publishers:
  - Berlin Art Link
  - The Berliner
  - Cee Cee Berlin
  - 20% Berlin
  - Exberliner

press_domains:
  - berlinartlink.com
  - ceecee.cc
  - 20percent.berlin
  - the-berliner.com
  - exberliner.com

# Stable venue programme/listing pages — OpenAI must web_search these for thin sections.
