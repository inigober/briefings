    url: https://www.museumsportal-berlin.de
    use_for: [comprehensive exhibition listings]
  - name: Berlin Art Link
    url: https://www.berlinartlink.com
    use_for: [contemporary art, openings, independent spaces]
  - name: Index Berlin
    url: https://www.indexberlin.com
    use_for: [gallery exhibitions, independent spaces]

