# Briefing type registry — scripts and workflows read paths from here.

briefings:
  news:
    display_name: News Briefing
    schedule_cron: "35 6 * * *" # daily 06:35 Europe/Berlin — triggered via cron-job.org (see docs/external-scheduling.md)
    inbox_dir: inbox/news
    output_dir: briefings/news
    state_dir: state/news
    config_dir: config/briefings/news
    synthesis_prompt: prompts/news/synthesis-run.md
    style_rule: .cursor/rules/news-briefing-style.mdc
    prefetch:
      rss: true
      wordpress: true
      merge_script: merge_news_inbox
      slim: true
    email:
      preheader_section: "What Matters Today"
      subject_emoji: "📰"

  berlin-culture:
    display_name: Berlin Culture Briefing
    schedule_cron: "0 6 * * 2" # Tuesday 06:00 Europe/Berlin — cron-job.org
    inbox_dir: inbox/berlin-culture
    output_dir: briefings/berlin-culture
    state_dir: state/berlin-culture
    config_dir: config/briefings/berlin-culture
    synthesis_prompt: prompts/berlin-culture/synthesis-run.md
    style_rule: .cursor/rules/berlin-culture-briefing-style.mdc
    prefetch:
      rss: true
      wordpress: true
      ics: true
      html_calendars: true
      openai_script: fetch_culture_research
      slim: true
      spend_cap_usd: 2.0  # documented default; live cap = GitHub variable OPENAI_DAILY_SPEND_CAP_USD or code default $2
    email:
      preheader_section: "Top Picks"
      subject_emoji: "🎭"

  berlin-restaurants:
    display_name: Berlin Restaurant Briefing
    schedule_cron: "0 7 * * 4" # Thursday 07:00 Europe/Berlin — cron-job.org
    inbox_dir: inbox/berlin-restaurants
    output_dir: briefings/berlin-restaurants
    state_dir: state/berlin-restaurants
    config_dir: config/briefings/berlin-restaurants
    synthesis_prompt: prompts/berlin-restaurants/synthesis-run.md
    style_rule: .cursor/rules/berlin-restaurants-briefing-style.mdc
    prefetch:
      rss: false
      openai_script: fetch_restaurant_research
      slim: true
      spend_cap_usd: 2.0  # documented default; live cap = GitHub variable OPENAI_DAILY_SPEND_CAP_USD or code default $2
    email:
      preheader_section: "This week's strongest bets"
      subject_emoji: "🍽️"
