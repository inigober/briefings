name: Daily research pre-fetch

on:
  schedule:
    # Daily 06:30 CET = 05:30 UTC (GitHub cron is UTC-only; see README for CEST note)
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD (optional; default today UTC)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  prefetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch RSS headlines
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="--date ${{ github.event.inputs.date }}"
          fi
          python scripts/fetch_rss.py $ARGS

      - name: Fetch OpenAI research
        env:
          PYTHONUNBUFFERED: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RESEARCH_MODEL: ${{ vars.OPENAI_RESEARCH_MODEL }}
        run: |
          echo "Checkout commit: $(git rev-parse HEAD)"
          echo "Model: ${OPENAI_RESEARCH_MODEL:-gpt-4.1}"
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="--date ${{ github.event.inputs.date }}"
          fi
          export OPENAI_RESEARCH_MODEL="${OPENAI_RESEARCH_MODEL:-gpt-4.1}"
          python scripts/fetch_openai_research.py $ARGS

      - name: Commit inbox if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox/
          if git diff --cached --quiet; then
            echo "No inbox changes to commit"
            exit 0
          fi
          git commit -m "inbox: $(date -u +%Y-%m-%d) research pre-fetch"
          # Remote may move while OpenAI calls run; rebase then push (retry once).
          for attempt in 1 2; do
            git pull --rebase origin main
            if git push origin main; then
              echo "Push succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}, retrying after rebase..."
            sleep 2
          done
          echo "Push failed after 2 attempts"
          exit 1
