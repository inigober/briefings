name: Send briefing email

on:
  push:
    paths:
      - "briefings/**/*.md"
    branches:
      - main
  workflow_dispatch:
    inputs:
      file:
        description: "Path to briefing markdown (optional)"
        required: false
        type: string
      all_changed:
        description: "Send every changed briefing file (default: newest per type only)"
        required: false
        type: boolean
        default: false

concurrency:
  group: send-briefing-email
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Need parent commits so git diff(before, sha) works; depth=1 caused
          # "fatal: bad object" and an empty CHANGED_FILES → wrong briefing sent.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Detect changed briefing files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          FILES=""
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            FILES=$(git diff --name-only --diff-filter=AM "${BEFORE}" "${AFTER}" -- 'briefings/**/*.md' | tr '\n' ' ')
          else
            echo "::warning::Parent commit ${BEFORE} not in checkout; using push event file list"
            FILES=$(python3 -c "
          import json, os
          commits = json.loads(os.environ['COMMITS_JSON'])
          paths = set()
          for commit in commits:
              for key in ('added', 'modified'):
                  for path in commit.get(key) or []:
                      if path.startswith('briefings/') and path.endswith('.md'):
                          paths.add(path)
          print(' '.join(sorted(paths)))
          ")
          fi
          # Drop paths that no longer exist (e.g. deletions still listed in push payload).
          EXISTING=""
          for path in $FILES; do
            if [ -f "$path" ]; then
              EXISTING="$EXISTING $path"
            else
              echo "Skipping missing briefing path: $path"
            fi
          done
          FILES="${EXISTING# }"
          echo "Detected briefing files: ${FILES:-<none>}"
          if [ -z "$FILES" ]; then
            echo "No existing briefing files to email (deletions only)."
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
        env:
          COMMITS_JSON: ${{ toJson(github.event.commits) }}

      - name: Verify briefing links
        if: success() && (github.event_name == 'workflow_dispatch' || steps.changed.outputs.files != '')
        run: |
          FILES="${{ steps.changed.outputs.files }}"
          if [ -n "${{ github.event.inputs.file }}" ]; then
            FILES="${{ github.event.inputs.file }}"
          fi
          for path in $FILES; do
            case "$path" in
              *.test.md)
                echo "Skipping test briefing: $path"
                continue
                ;;
              briefings/news/*.md)
                DATE=$(basename "$path" .md)
                DATE="${DATE%.test}"
                echo "Verifying news sources for $DATE"
                python scripts/verify_briefing_sources.py --type news --date "$DATE"
                ;;
              briefings/music-discovery/*.md)
                DATE=$(basename "$path" .md)
                echo "HTTP-verifying music-discovery URLs for $DATE"
                python scripts/verify_music_urls.py --type music-discovery --date "$DATE"
                ;;
              briefings/berlin-culture/*.md)
                DATE=$(basename "$path" .md)
                echo "Validating culture briefing structure for $DATE"
                python scripts/validate_culture_briefing.py --path "$path"
                echo "HTTP-verifying culture Official Links for $DATE"
                python scripts/verify_culture_briefing_urls.py --type berlin-culture --date "$DATE"
                ;;
              briefings/berlin-restaurants/*.md)
                DATE=$(basename "$path" .md)
                echo "Verifying restaurant Maps URLs for $DATE"
                python scripts/verify_restaurant_briefing_sources.py --type berlin-restaurants --date "$DATE"
                ;;
            esac
          done

      - name: Send via Resend
        if: success() && (github.event_name == 'workflow_dispatch' || steps.changed.outputs.files != '')
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEFING_FROM_EMAIL: ${{ vars.BRIEFING_FROM_EMAIL }}
          BRIEFING_TO_EMAIL: ${{ vars.BRIEFING_TO_EMAIL }}
          BRIEFING_EMAIL_CALLOUTS: "true"
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          BRIEFING_EMAIL_ALL_CHANGED: ${{ github.event.inputs.all_changed && 'true' || '' }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.file }}" ]; then
            ARGS="--file ${{ github.event.inputs.file }}"
          fi
          if [ "${{ github.event.inputs.all_changed }}" = "true" ]; then
            ARGS="$ARGS --all-changed"
          fi
          python scripts/send_briefing_email.py $ARGS

      - name: Commit email delivery log
        if: success()
        run: |
          if [ ! -f state/email_delivery.json ]; then
            echo "No delivery log to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/email_delivery.json
          if git diff --cached --quiet; then
            echo "Delivery log unchanged"
            exit 0
          fi
          git commit -m "state: email delivery log"
          git pull --rebase origin main || true
          git push origin main || true

      - name: Alert on send failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEFING_FROM_EMAIL: ${{ vars.BRIEFING_FROM_EMAIL }}
          BRIEFING_TO_EMAIL: ${{ vars.BRIEFING_TO_EMAIL }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHANGED_FILES: ${{ steps.changed.outputs.files || github.event.inputs.file || '' }}
          SEND_FAILURE_REASON: "verify or send step failed"
        run: python scripts/notify_send_failure.py
