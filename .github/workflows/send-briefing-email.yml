name: Send briefing email

on:
  push:
    paths:
      - "briefings/**/*.md"
    branches:
      - main
  workflow_dispatch:
    inputs:
      file:
        description: "Path to briefing markdown (optional)"
        required: false
        type: string

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Need parent commits so git diff(before, sha) works; depth=1 caused
          # "fatal: bad object" and an empty CHANGED_FILES → wrong briefing sent.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Detect changed briefing files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          FILES=""
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            FILES=$(git diff --name-only "${BEFORE}" "${AFTER}" -- 'briefings/**/*.md' | tr '\n' ' ')
          else
            echo "::warning::Parent commit ${BEFORE} not in checkout; using push event file list"
            FILES=$(python3 -c "
          import json, os
          commits = json.loads(os.environ['COMMITS_JSON'])
          paths = set()
          for commit in commits:
              for key in ('added', 'modified', 'removed'):
                  for path in commit.get(key) or []:
                      if path.startswith('briefings/') and path.endswith('.md'):
                          paths.add(path)
          print(' '.join(sorted(paths)))
          ")
          fi
          echo "Detected briefing files: ${FILES:-<none>}"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
        env:
          COMMITS_JSON: ${{ toJson(github.event.commits) }}

      - name: Send via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEFING_FROM_EMAIL: ${{ vars.BRIEFING_FROM_EMAIL }}
          BRIEFING_TO_EMAIL: ${{ vars.BRIEFING_TO_EMAIL }}
          BRIEFING_EMAIL_CALLOUTS: "true"
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.file }}" ]; then
            ARGS="--file ${{ github.event.inputs.file }}"
          fi
          python scripts/send_briefing_email.py $ARGS
