name: Berlin restaurant research pre-fetch

on:
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD Thursday run date (optional; default today UTC)"
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: berlin-restaurants-prefetch
  cancel-in-progress: false

jobs:
  prefetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Resolve run date
        id: run_date
        run: |
          INPUT="${{ github.event.inputs.date }}"
          if [ -z "$INPUT" ]; then INPUT=$(date -u +%Y-%m-%d); fi
          RESOLVED=$(python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          from restaurant_dates import normalize_thursday_run_date
          print(normalize_thursday_run_date('$INPUT')[0])
          ")
          echo "value=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "Using restaurant week key: $RESOLVED"

      - name: Fetch OpenAI restaurant research
        id: openai_fetch
        env:
          PYTHONUNBUFFERED: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RESEARCH_MODEL: ${{ vars.OPENAI_RESEARCH_MODEL }}
          OPENAI_DAILY_SPEND_CAP_USD: ${{ vars.OPENAI_DAILY_SPEND_CAP_USD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEFING_FROM_EMAIL: ${{ vars.BRIEFING_FROM_EMAIL }}
          BRIEFING_TO_EMAIL: ${{ vars.BRIEFING_TO_EMAIL }}
        run: |
          echo "Daily spend cap: ${OPENAI_DAILY_SPEND_CAP_USD:-2} USD"
          ARGS="--type berlin-restaurants --date ${{ steps.run_date.outputs.value }}"
          export OPENAI_RESEARCH_MODEL="${OPENAI_RESEARCH_MODEL:-gpt-5.4}"
          export OPENAI_DAILY_SPEND_CAP_USD="${OPENAI_DAILY_SPEND_CAP_USD:-2}"
          python scripts/fetch_restaurant_research.py $ARGS

      - name: Commit spend ledger on cap abort
        if: failure() && steps.openai_fetch.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox/berlin-restaurants/*-spend.json inbox/berlin-restaurants/*-spend-cap.error.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No spend ledger to commit"
            exit 0
          fi
          git commit -m "inbox/berlin-restaurants: spend cap abort $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push origin main || true

      - name: Verify restaurants via Google Places API
        if: success()
        env:
          PYTHONUNBUFFERED: "1"
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          python scripts/verify_restaurant_maps.py --date ${{ steps.run_date.outputs.value }}

      - name: Slim inbox for synthesis
        if: success()
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/slim_inbox_for_synthesis.py --type berlin-restaurants --date ${{ steps.run_date.outputs.value }}

      - name: Commit inbox if changed
        if: success()
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox/berlin-restaurants/
          if git diff --cached --quiet; then
            echo "No inbox changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "inbox/berlin-restaurants: ${{ steps.run_date.outputs.value }} research pre-fetch"
          for attempt in 1 2; do
            git pull --rebase origin main
            if git push origin main; then
              echo "Push succeeded on attempt ${attempt}"
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}, retrying after rebase..."
            sleep 2
          done
          echo "Push failed after 2 attempts"
          exit 1

      # GITHUB_TOKEN pushes do not trigger other workflows; dispatch the PR request explicitly.
      - name: Trigger Codex synthesis PR request
        if: success() && steps.commit.outputs.pushed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh workflow run request-codex-synthesis.yml --ref main -f type_id=berlin-restaurants -f date=${{ steps.run_date.outputs.value }}
