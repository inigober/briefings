name: Berlin culture research pre-fetch

on:
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD Tuesday run date (optional; default today UTC)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: berlin-culture-prefetch
  cancel-in-progress: false

jobs:
  prefetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Resolve run date
        id: run_date
        run: |
          INPUT="${{ github.event.inputs.date }}"
          if [ -z "$INPUT" ]; then INPUT=$(date -u +%Y-%m-%d); fi
          RESOLVED=$(python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          from culture_dates import normalize_tuesday_run_date
          print(normalize_tuesday_run_date('$INPUT')[0])
          ")
          echo "value=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "Using culture week key: $RESOLVED"

      - name: Fetch OpenAI culture research
        id: openai_fetch
        env:
          PYTHONUNBUFFERED: "1"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RESEARCH_MODEL: ${{ vars.OPENAI_RESEARCH_MODEL }}
          OPENAI_DAILY_SPEND_CAP_USD: ${{ vars.OPENAI_DAILY_SPEND_CAP_USD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEFING_FROM_EMAIL: ${{ vars.BRIEFING_FROM_EMAIL }}
          BRIEFING_TO_EMAIL: ${{ vars.BRIEFING_TO_EMAIL }}
        run: |
          echo "Daily spend cap: ${OPENAI_DAILY_SPEND_CAP_USD:-2} USD"
          ARGS="--type berlin-culture --date ${{ steps.run_date.outputs.value }}"
          export OPENAI_RESEARCH_MODEL="${OPENAI_RESEARCH_MODEL:-gpt-4.1}"
          export OPENAI_DAILY_SPEND_CAP_USD="${OPENAI_DAILY_SPEND_CAP_USD:-2}"
          python scripts/fetch_culture_research.py $ARGS

      - name: Commit spend ledger on cap abort
        if: failure() && steps.openai_fetch.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox/berlin-culture/*-spend.json inbox/berlin-culture/*-spend-cap.error.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No spend ledger to commit"
            exit 0
          fi
          git commit -m "inbox/berlin-culture: spend cap abort $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push origin main || true

      - name: Slim inbox for synthesis
        if: success()
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/slim_inbox_for_synthesis.py --type berlin-culture --date ${{ steps.run_date.outputs.value }}

      - name: Commit inbox if changed
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox/berlin-culture/
          if git diff --cached --quiet; then
            echo "No inbox changes to commit"
            exit 0
          fi
          git commit -m "inbox/berlin-culture: ${{ steps.run_date.outputs.value }} research pre-fetch"
          for attempt in 1 2; do
            git pull --rebase origin main
            if git push origin main; then
              echo "Push succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}, retrying after rebase..."
            sleep 2
          done
          echo "Push failed after 2 attempts"
          exit 1
