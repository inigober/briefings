# Turn an inbox push into a Codex Cloud synthesis PR.
# Codex is invoked by the GitHub integration, not by the OpenAI API.

name: Request Codex Cloud synthesis

on:
  push:
    branches: [main]
    paths:
      - "inbox/**"
  workflow_dispatch:
    inputs:
      type_id:
        description: "news | berlin-culture | berlin-restaurants | music-discovery"
        required: true
        type: string
      date:
        description: "YYYY-MM-DD inbox date"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: request-codex-synthesis
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Resolve synthesis request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TYPE: ${{ github.event.inputs.type_id || '' }}
          INPUT_DATE: ${{ github.event.inputs.date || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TYPE="$INPUT_TYPE"
            DATE="$INPUT_DATE"
            REASON="manual synthesis request"
            MATCHED="inbox/${TYPE}/${DATE}-synthesis.json"
          else
            python scripts/detect_synthesis_trigger.py --json --commit "${{ github.sha }}" > decision.json
            cat decision.json
            TYPE=$(python3 -c 'import json; print(json.load(open("decision.json")).get("type_id") or "")')
            REASON=$(python3 -c 'import json; print(json.load(open("decision.json")).get("reason") or "")')
            MATCHED=$(python3 -c 'import json; print(" ".join(json.load(open("decision.json")).get("matched_files") or []))')
            DATE=$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.load(open("decision.json"))
          date = ""
          for path in data.get("matched_files") or []:
              name = Path(path).name
              for suffix in ("-synthesis.json", "-raw.json", "-context.json"):
                  if name.endswith(suffix):
                      date = name[: -len(suffix)]
                      break
              if date:
                  break
          print(date)
          PY
            )
          fi
          case "$TYPE" in
            news|berlin-culture|berlin-restaurants|music-discovery) ;;
            "")
              echo "No synthesis request: ${REASON:-no eligible inbox change}"
              echo "should_request=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "::error::Unknown briefing type: $TYPE"
              exit 1
              ;;
          esac
          if ! [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Invalid synthesis date: $DATE"
            exit 1
          fi
          if [ ! -f "inbox/${TYPE}/${DATE}-synthesis.json" ] && [ ! -f "inbox/${TYPE}/${DATE}-raw.json" ]; then
            echo "::error::No synthesis inbox file found for ${TYPE} ${DATE}"
            exit 1
          fi
          if [ -f "briefings/${TYPE}/${DATE}.md" ]; then
            echo "Briefing already exists for ${TYPE} ${DATE}; no PR needed"
            echo "should_request=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "type_id=$TYPE" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "matched_files=$MATCHED" >> "$GITHUB_OUTPUT"
          echo "should_request=true" >> "$GITHUB_OUTPUT"

      - name: Create synthesis PR and invoke Codex
        if: steps.request.outputs.should_request == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TYPE: ${{ steps.request.outputs.type_id }}
          DATE: ${{ steps.request.outputs.date }}
          REASON: ${{ steps.request.outputs.reason }}
          MATCHED_FILES: ${{ steps.request.outputs.matched_files }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BRANCH="automation/synthesis-${TYPE}-${DATE}-${SHORT_SHA}"
          EXISTING=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Synthesis PR #$EXISTING already exists for $TYPE $DATE"
            exit 0
          fi

          MARKER=".github/synthesis-requests/${TYPE}-${DATE}.json"
          git switch -c "$BRANCH"
          mkdir -p .github/synthesis-requests
          TYPE="$TYPE" DATE="$DATE" REASON="$REASON" MATCHED_FILES="$MATCHED_FILES" GITHUB_SHA="${GITHUB_SHA}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          marker = Path(".github/synthesis-requests") / f"{os.environ['TYPE']}-{os.environ['DATE']}.json"
          marker.write_text(json.dumps({
              "type_id": os.environ["TYPE"],
              "date": os.environ["DATE"],
              "reason": os.environ.get("REASON", ""),
              "source_commit": os.environ.get("GITHUB_SHA", ""),
              "matched_files": os.environ.get("MATCHED_FILES", "").split(),
          }, indent=2) + "\n", encoding="utf-8")
          PY
          git add "$MARKER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "automation: request ${TYPE} synthesis ${DATE}"
          git push --set-upstream origin "$BRANCH"

          cat > pr-body.md <<EOF
          This PR is a Codex Cloud synthesis job for **${TYPE}**, date **${DATE}**.

          The source inbox commit is already on main. Codex should work on this branch only.
          EOF
          PR_URL=$(gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --head "$BRANCH" \
            --title "automation: synthesize ${TYPE} ${DATE}" \
            --body-file pr-body.md)

          cat > codex-request.md <<EOF
          @codex Synthesize the briefing requested by ${MARKER}.

          Follow the root AGENTS.md, CURSOR_INSTRUCTIONS.md, prompts/codex-cloud-synthesis-run.md, and the applicable prompts/${TYPE}/synthesis-run.md. Read the inbox/state rules and write the production briefing plus required state updates to this PR branch.

          Run the required type-specific verification scripts. Only after verification succeeds, remove ${MARKER} and commit all changes to this branch. Do not push to main, do not send email, and do not use the OpenAI API.
          EOF
          gh pr comment "$PR_URL" --body-file codex-request.md
          echo "Created $PR_URL and requested Codex Cloud synthesis"
