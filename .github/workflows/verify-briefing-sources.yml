name: Verify briefing sources

on:
  push:
    branches: [main]
    paths:
      - "briefings/news/**"
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD (optional; default from briefing filename)"
        required: false
        type: string

jobs:
  verify-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Verify news briefing URLs
        run: |
          shopt -s nullglob
          mapfile -t CHANGED < <(
            if [ -n "${{ github.event.inputs.date }}" ]; then
              printf '%s\n' "briefings/news/${{ github.event.inputs.date }}.md"
            else
              git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- briefings/news/ 2>/dev/null \
                | grep -E '^briefings/news/[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' || true
            fi
          )
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            LATEST=$(ls -1 briefings/news/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].md 2>/dev/null | sort | tail -1 || true)
            if [ -n "$LATEST" ]; then
              CHANGED=("$LATEST")
            fi
          fi
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "No news briefing to verify"
            exit 0
          fi
          for path in "${CHANGED[@]}"; do
            if [ ! -f "$path" ]; then
              echo "Skipping missing briefing file: $path"
              continue
            fi
            DATE=$(basename "$path" .md)
            echo "Verifying briefing/news for $DATE"
            python scripts/verify_briefing_sources.py --type news --date "$DATE"
          done
