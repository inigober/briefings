name: News research pre-fetch

on:
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD (optional; default today UTC)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: news-prefetch
  cancel-in-progress: false

jobs:
  prefetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Resolve run date
        id: run_date
        run: |
          INPUT="${{ github.event.inputs.date }}"
          if [ -z "$INPUT" ]; then INPUT=$(date -u +%Y-%m-%d); fi
          echo "value=$INPUT" >> "$GITHUB_OUTPUT"
          echo "Using news date key: $INPUT"

      - name: Fetch RSS headlines
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/fetch_rss.py --type news --date ${{ steps.run_date.outputs.value }}

      - name: Fetch WordPress posts
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/fetch_wordpress.py --type news --date ${{ steps.run_date.outputs.value }}

      - name: Merge inbox
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/merge_news_inbox.py --type news --date ${{ steps.run_date.outputs.value }}

      - name: Verify news URLs
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/verify_news_urls.py --type news --date ${{ steps.run_date.outputs.value }}

      - name: Slim inbox for synthesis
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/slim_inbox_for_synthesis.py --type news --date ${{ steps.run_date.outputs.value }}

      - name: Commit inbox if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox/news/
          if git diff --cached --quiet; then
            echo "No inbox changes to commit"
            exit 0
          fi
          git commit -m "inbox/news: ${{ steps.run_date.outputs.value }} research pre-fetch"
          for attempt in 1 2; do
            git pull --rebase origin main
            if git push origin main; then
              echo "Push succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}, retrying after rebase..."
            sleep 2
          done
          echo "Push failed after 2 attempts"
          exit 1
