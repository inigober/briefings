name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate culture briefings
        run: |
          failed=0
          for f in briefings/berlin-culture/*.md; do
            case "$f" in
              *.test.md) continue ;;
            esac
            echo "Validating $f"
            python scripts/validate_culture_briefing.py --path "$f" || failed=1
          done
          exit "$failed"
