name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate latest culture briefing
        run: |
          latest=$(ls briefings/berlin-culture/*.md 2>/dev/null | grep -v '.test.md' | sort | tail -1)
          if [ -z "$latest" ]; then
            echo "No culture briefings to validate — skipping"
            exit 0
          fi
          echo "Validating latest briefing: $latest"
          python scripts/validate_culture_briefing.py --path "$latest"
