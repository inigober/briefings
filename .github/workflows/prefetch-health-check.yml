name: Pre-fetch health check

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "all (default), morning (news+culture), or restaurants"
        required: false
        default: all
        type: choice
        options:
          - all
          - morning
          - restaurants
      date:
        description: "YYYY-MM-DD UTC (optional)"
        required: false
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: prefetch-health-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # Inbox + synthesis: missing inbox → retry pre-fetch; inbox ready but no
      # production briefing → email only (Actions cannot start Cursor).
      - name: Check inbox landed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEFING_FROM_EMAIL: ${{ vars.BRIEFING_FROM_EMAIL }}
          BRIEFING_TO_EMAIL: ${{ vars.BRIEFING_TO_EMAIL }}
        run: |
          PROFILE="${{ github.event.inputs.profile || 'all' }}"
          ARGS="--profile $PROFILE --retry"
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          python scripts/check_prefetch_health.py $ARGS

      - name: Check undelivered briefings
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEFING_FROM_EMAIL: ${{ vars.BRIEFING_FROM_EMAIL }}
          BRIEFING_TO_EMAIL: ${{ vars.BRIEFING_TO_EMAIL }}
        run: |
          # Briefings on main with no successful email record → alert + re-trigger send
          python scripts/check_email_delivery.py --retry

