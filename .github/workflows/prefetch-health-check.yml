name: Pre-fetch health check

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "all (default), morning (news+culture), or restaurants"
        required: false
        default: all
        type: choice
        options:
          - all
          - morning
          - restaurants
      date:
        description: "YYYY-MM-DD UTC (optional)"
        required: false
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: prefetch-health-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check inbox landed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEFING_FROM_EMAIL: ${{ vars.BRIEFING_FROM_EMAIL }}
          BRIEFING_TO_EMAIL: ${{ vars.BRIEFING_TO_EMAIL }}
        run: |
          PROFILE="${{ github.event.inputs.profile || 'all' }}"
          ARGS="--profile $PROFILE --retry"
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          python scripts/check_prefetch_health.py $ARGS

      - name: Check undelivered briefings
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEFING_FROM_EMAIL: ${{ vars.BRIEFING_FROM_EMAIL }}
          BRIEFING_TO_EMAIL: ${{ vars.BRIEFING_TO_EMAIL }}
        run: |
          # Briefings on main with no successful email record → alert + re-trigger send
          python scripts/check_email_delivery.py --retry

      - name: Retry missing synthesis
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DECISION=$(python scripts/detect_synthesis_trigger.py --json --backup)
          echo "$DECISION"
          TYPE=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1]).get("type_id") or "")' "$DECISION")
          if [ -z "$TYPE" ]; then
            echo "No inbox-ready missing briefing — synthesis retry not needed"
            exit 0
          fi
          echo "Dispatching synthesize-briefing.yml (backup) for type=$TYPE"
          gh workflow run synthesize-briefing.yml --ref main -f mode=backup

